name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static checks and SDK smoke test
        run: npm test
      - name: Build Cloudflare Pages Function bundle
        run: npx --yes wrangler@latest pages functions build --outdir .wrangler/functions-build
      - name: Pages Functions runtime smoke test (including WASM)
        run: node scripts/smoke-pages-runtime.mjs
